<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a Time</title>
  <style>
    :root { --bg: #f4f5f7; --ink: #16181d; --muted: #5b6270; --accent: #2f5ba8; --accent-ink: #fff; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1f1f1f; --ink: #eceef2; --muted: #9aa2b1; --accent: #6f9bff; --accent-ink: #0b1430; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
           font: 16px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 520px; }
    h1 { font-size: clamp(28px, 4vw, 40px); letter-spacing: -0.02em; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: var(--muted); }
    a.open { display: inline-block; background: var(--accent); color: var(--accent-ink); padding: 14px 28px; border-radius: 10px;
             font-weight: 700; font-size: 18px; text-decoration: none; }
    a.open:hover { filter: brightness(1.08); }
    a.open:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .hint { margin-top: 24px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Find a Time</h1>
    <p>See when you and your colleagues are all free in your uni calendars, and book the meeting.</p>
    <a class="open" href="https://localhost:8443/" target="_blank" rel="noopener">Open Find a Time</a>
    <p class="hint">Opens in your browser. Nothing happens? Start “Find a Time” from the Windows Start menu once, then try again.</p>
  </main>
</body>
</html>
